# Perfil prod: PostgreSQL (ver docker-compose.yml). Segredos so por variavel de ambiente, nunca no repositorio.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:idp}
spring.datasource.username=${DB_USER:idp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Sem stack trace nem mensagens internas nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
