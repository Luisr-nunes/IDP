# Perfil dev: roda sem nenhum servico instalado. H2 gravado em arquivo (pasta data/, fora do Git),
# entao o historico continua la depois de reiniciar a aplicacao. Para zerar, apague a pasta data/.
spring.datasource.url=jdbc:h2:file:./data/idp
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Sem APP_DADOS_CHAVE, o dev gera uma chave local em data/ (fora do Git) na primeira execucao
app.dados.arquivo-chave-dev=./data/chave-dev.key
