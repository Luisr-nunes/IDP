spring.application.name=validacao-documentos

# Limite de upload (PDF/imagem)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Prazo maximo de emissao do comprovante de residencia, em dias
app.validacao.prazo-emissao-dias=90

# OCR com o executavel do Tesseract. Sem tessdata-path, usa conteudoDocumento como fallback
app.ocr.command=tesseract
app.ocr.tessdata-path=
app.ocr.language=por

# Pre-processamento com OpenCV via comando externo (recebe arquivoEntrada arquivoSaida). Vazio = sem pre-processamento
# Exemplo: app.opencv.command=python scripts/preprocessar_documento.py
app.opencv.command=

# Interpretacao com IA (OpenAI). A chave vem so da variavel de ambiente OPENAI_API_KEY e nunca fica no repositorio.
# Sem chave, a extracao e feita localmente por regex.
app.ai.openai.api-key=${OPENAI_API_KEY:}

# Perfis: dev (padrao, H2 em memoria) e prod (PostgreSQL). Use SPRING_PROFILES_ACTIVE=prod em producao.
spring.profiles.default=dev
spring.jpa.open-in-view=false

# Sem cache dos arquivos da tela: o navegador sempre pega a versao atual
spring.web.resources.cache.cachecontrol.no-cache=true

# Chave AES-256 (Base64 de 32 bytes) que cifra os dados extraidos no banco. Em prod, so por variavel de ambiente.
app.dados.chave=${APP_DADOS_CHAVE:}
