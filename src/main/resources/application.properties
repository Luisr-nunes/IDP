spring.application.name=validacao-documentos

# Limite de upload (PDF/imagem)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Prazo maximo de emissao do comprovante de residencia, em dias
app.validacao.prazo-emissao-dias=90

# OCR com o executavel do Tesseract. Sem tessdata-path, usa conteudoDocumento como fallback
app.ocr.command=tesseract
app.ocr.tessdata-path=
app.ocr.language=por
